name: iKuuu Daily Bonus

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 2:00 PM UTC (8:00 AM CST)
  workflow_dispatch:  # Allows manual trigger

jobs:
  daily-bonus:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run automation script
        env:
          IKUUU_EMAIL: ${{ secrets.IKUUU_EMAIL }}
          IKUUU_PASSWORD: ${{ secrets.IKUUU_PASSWORD }}
        run: |
          npm install puppeteer
          node - << 'EOF'
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox']
            });
            const page = await browser.newPage();
            
            try {
              console.log('Opening iKuuu login page...');
              await page.goto('https://ikuuu.de/auth/login', { 
                waitUntil: 'networkidle2',
                timeout: 30000 
              });
              
              console.log('Logging in...');
              // Fill in email
              await page.type('input[type="email"]', process.env.IKUUU_EMAIL, { delay: 50 });
              console.log('Email entered');
              
              // Fill in password
              await page.type('input[type="password"]', process.env.IKUUU_PASSWORD, { delay: 50 });
              console.log('Password entered');
              
              // Click login button
              const loginButton = await page.$('button[type="submit"]');
              if (loginButton) {
                await loginButton.click();
                console.log('Login button clicked');
              } else {
                console.log('Could not find login button');
              }
              
              // Wait for navigation to complete after login
              await page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 30000 }).catch(() => {});
              console.log('Login completed, navigating to dashboard');
              
              // Navigate to dashboard
              await page.goto('https://ikuuu.de/user#', { 
                waitUntil: 'networkidle2',
                timeout: 30000 
              });
              
              console.log('Page loaded, searching for bonus button...');
              // Wait a bit for page to render
              await new Promise(resolve => setTimeout(resolve, 2000));
              
              // Try to click the daily bonus button
              const clicked = await page.evaluate(() => {
                const buttons = document.querySelectorAll('a, button');
                for (let btn of buttons) {
                  const text = btn.textContent.toLowerCase();
                  if (text.includes('come back tomorrow') || 
                      text.includes('签到') ||
                      text.includes('daily')) {
                    btn.click();
                    return true;
                  }
                }
                return false;
              });
              
              if (clicked) {
                console.log('✓ Daily bonus button clicked successfully!');
              } else {
                console.log('✗ Bonus button not found (may already be claimed today)');
              }
              
              // Wait a bit to see if anything happens
              await new Promise(resolve => setTimeout(resolve, 1000));
              console.log('Task completed');
              
            } catch (error) {
              console.error('Error:', error.message);
              console.error('Stack:', error.stack);
            } finally {
              await browser.close();
            }
          })();
          EOF
